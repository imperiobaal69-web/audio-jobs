apiVersion: v1
kind: ConfigMap
metadata:
  name: audio-jobs
  namespace: audio-jobs
data:
  REDIS_ADDR: redis:6379
  BLOB_DIR: /data/blobs
  MAX_ATTEMPTS: "5"
  WORKER_CONCURRENCY: "4"
  VISIBILITY_TIMEOUT: 30s
  SWEEP_EVERY: 30s
  SWEEP_IDLE: 2m
  # Must stay below terminationGracePeriodSeconds of each Deployment.
  SHUTDOWN_GRACE: 25s
---
# Example only: in a real cluster this comes from a secret manager
# (External Secrets, Sealed Secrets, ...), never from the repository.
apiVersion: v1
kind: Secret
metadata:
  name: audio-jobs-db
  namespace: audio-jobs
type: Opaque
stringData:
  DATABASE_URL: postgres://audiojobs:change-me@postgres:5432/audiojobs?sslmode=disable
