apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: audio-jobs
  labels: {app: api}
spec:
  replicas: 3
  selector:
    matchLabels: {app: api}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/imperiobaal69-web/audio-jobs:latest
          command: ["/usr/local/bin/api"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: HTTP_ADDR, value: ":8080"}
            - name: CONSUMER_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          envFrom:
            - configMapRef: {name: audio-jobs}
            - secretRef: {name: audio-jobs-db}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: blobs, mountPath: /data/blobs}
      volumes:
        - name: blobs
          persistentVolumeClaim: {claimName: blobs}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: audio-jobs
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: audio-jobs
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: api}
